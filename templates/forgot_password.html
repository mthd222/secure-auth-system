<!DOCTYPE html>
<html>
<head>

    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <div class="logo">Reset</div>

    <h1>Forgot Password</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/forgot-password" method="POST">
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <input type="email"
               name="email"
               placeholder="Enter Registered Email"
               required>

        <button type="submit">
            Verify Account
        </button>
    </form>

    <a href="/">
        Back to Login
    </a>

    <div class="footer">
        Password Reset Verification
    </div>

</div>

</body>
</html>
