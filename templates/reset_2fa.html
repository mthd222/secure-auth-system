<!DOCTYPE html>
<html>
<head>

    <title>Reset 2FA</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <div class="logo">2FA</div>

    <h1>Reset 2FA</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/reset-2fa" method="POST">
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <div class="password-container">
            <input type="password"
                   id="reset2fapassword"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="button"
                    class="password-toggle"
                    data-target="reset2fapassword">
                Show
            </button>
        </div>

        <button type="submit">
            Generate New 2FA Key
        </button>
    </form>

    <a href="/">
        Back to Login
    </a>

    <div class="footer">
        This requires your account password
    </div>

</div>

<script src="{{ url_for('static',
filename='js/script.js') }}"></script>

</body>
</html>
