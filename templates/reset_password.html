<!DOCTYPE html>
<html>
<head>

    <title>Reset Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <div class="logo">Reset</div>

    <h1>Set New Password</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/reset-password" method="POST">
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <div class="password-container">
            <input type="password"
                   id="newpassword"
                   name="password"
                   placeholder="New Password"
                   required>

            <button type="button"
                    class="password-toggle"
                    data-target="newpassword">
                Show
            </button>
        </div>

        <div class="password-container">
            <input type="password"
                   id="confirmpassword"
                   name="confirm_password"
                   placeholder="Confirm Password"
                   required>

            <button type="button"
                    class="password-toggle"
                    data-target="confirmpassword">
                Show
            </button>
        </div>

        <button type="submit">
            Update Password
        </button>
    </form>

    <div class="footer">
        Passwords are stored only as hashes
    </div>

</div>

<script src="{{ url_for('static',
filename='js/script.js') }}"></script>

</body>
</html>
